name: CI

on:
  pull_request_target:
    types: [ labeled ]

jobs:
  # Remove label that triggers the CI
  run_tests_label_remover:
    permissions:
      contents: read
      pull-requests: write
    uses: Tai-Min/Hardware-Actions/.github/workflows/run_tests_label_remover.yml@master
    with:
      label: ${{ github.event.label.name }}

  hardware_checks:
    if: ${{ github.event.label.name == 'run_tests' }}
    permissions:
      pull-requests: write
      contents: write
    uses: Tai-Min/Hardware-Actions/.github/workflows/hardware_checks.yml@master
    with:
      head_ref: ${{ github.head_ref }}
      pr_number: ${{ github.event.pull_request.number }}
      repo_name: ${{ github.event.pull_request.head.repo.full_name }}

  post_comment:
    needs: [hardware_checks]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Committer check
      id: committer_check
      uses: Tai-Min/Hardware-Actions/.github/actions/committer_check@master
      with:
        repo: ${{ github.repository }}
        pr_number: ${{ github.event.pull_request.number }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete previous comment
      if: steps.committer_check.outputs.association == 'true'
      uses: Tai-Min/Hardware-Actions/.github/actions/comment_remover@master
      with:
        pr_number: ${{ github.event.pull_request.number }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        magic_header: "<!-- TEST_RUNNER -->"

    - name: Create comment
      id: comment
      run: |

        COMMENT="<!-- TEST_RUNNER -->"

        if [[ "${{ needs.hardware_checks.outputs.skipped }}" = 'true' ]]; then
          COMMENT="${COMMENT}\n## Hardware checks\n- Skipped."
        else
          COMMENT="${COMMENT}\n## Hardware checks\n${{ needs.hardware_checks.outputs.comment }}"
        fi

        # Post comment instantly as the collaborator has write access
        if [[ "${{ steps.committer_check.outputs.association }}" = 'true' ]]; then
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo -e "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

        # Post comment via cron job later
        else
          mkdir ./comments
          echo -e "$COMMENT" > ./comments/message.md
        fi
        
    - name: Post comment with results
      if: steps.committer_check.outputs.association == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const body = `
          ${{ steps.comment.outputs.comment }}
          `;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          });
